<div class="flex min-h-[60vh] items-center justify-center py-8">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h2 class="text-2xl font-bold tracking-tight">Sign in</h2>
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
        Choose your sign-in method to continue
      </p>
    </div>

    <div
      class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm dark:border-gray-800 dark:bg-gray-900"
    >
      <div class="flex flex-col gap-3">
        <app-social-login-button
          icon="google"
          label="Google"
          [disabled]="loading()"
          (clicked)="onSignIn('google')"
        />
        <app-social-login-button
          icon="github"
          label="GitHub"
          [disabled]="loading()"
          (clicked)="onSignIn('github')"
        />
      </div>

      @if (errorMessage()) {
        <div class="mt-5">
          <p-message severity="error" icon="pi pi-times-circle">{{ errorMessage() }}</p-message>
        </div>
      }
    </div>
  </div>
</div>
