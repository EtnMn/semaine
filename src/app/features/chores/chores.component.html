@if (loading()) {
  <div class="flex flex-wrap justify-center gap-6 lg:justify-start">
    @for (_ of [1, 2, 3, 4]; track $index) {
      <div hlmSkeleton class="aspect-square w-full max-w-sm rounded-xl"></div>
    }
  </div>
} @else if (chores().length === 0) {
  <app-empty-message title="No chores yet" caption="Create your first task to get started.">
  </app-empty-message>
} @else {
  <div class="flex flex-wrap justify-center gap-6 lg:justify-start">
    @for (chore of chores(); track chore.id) {
      <app-chore-card
        [chore]="chore"
        [closing]="closingChoreIds().includes(chore.id)"
        (closed)="onCloseChore($event)"
      />
    }
  </div>
}
