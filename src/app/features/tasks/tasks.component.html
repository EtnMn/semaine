<div class="mb-8 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold">
      Manage tasks
      @if (total() > 0) {
        <span>({{ total() }})</span>
      }
    </h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Organise and track your tasks</p>
  </div>
  @if (total() > 0) {
    <button hlmBtn (click)="onCreateTask()">Create Task</button>
  }
</div>

<app-task-form-dialog
  [task]="editingTask()"
  [(displayed)]="taskFormDisplayed"
  (taskSaved)="onSaveTask($event)"
/>

<div class="mb-4 flex items-center gap-4">
  <div hlmInputGroup class="max-w-xs bg-white">
    <div hlmInputGroupAddon>
      <ng-icon name="lucideSearch" />
    </div>
    <input
      hlmInputGroupInput
      type="text"
      placeholder="Search"
      (input)="onSearch($event.target.value)"
    />
  </div>
  <div class="ml-auto flex items-center gap-2">
    <span class="text-sm text-gray-600 dark:text-gray-400">Started</span>
    <hlm-switch [(ngModel)]="showOnlyStarted" (ngModelChange)="loadPage(1)" />
  </div>
</div>

@if (loading()) {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (_ of [1, 2, 3, 4, 5, 6]; track $index) {
      <div hlmSkeleton class="h-40 rounded-xl"></div>
    }
  </div>
} @else if (total() === 0) {
  <app-empty-message title="No tasks yet" caption="Create your first task to get started.">
    <button hlmBtn footer (click)="onCreateTask()">Create Task</button>
  </app-empty-message>
} @else {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (task of tasks(); track task.id) {
      <app-task-card
        [task]="task"
        (taskEdited)="onEditTask($event)"
        (taskDeleted)="onDeleteTask($event)"
      />
    }
  </div>

  <hlm-numbered-pagination
    [currentPage]="currentPage()"
    (currentPageChange)="loadPage($event)"
    [itemsPerPage]="pageSize()"
    (itemsPerPageChange)="onPageSizeChange($event)"
    [totalItems]="total()"
    [pageSizes]="[9, 18, 36]"
  />
}
