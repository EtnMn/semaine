<div
  class="task-card relative flex h-full flex-col overflow-hidden rounded-xl bg-white text-left shadow-md transition duration-300 hover:-translate-y-0.5 hover:shadow-lg dark:bg-gray-800"
  [class]="getDifficultyColorClass(task().difficulty)"
  [class.opacity-75]="!task().started"
  [class.grayscale]="!task().started"
>
  <div
    class="flex cursor-pointer items-center gap-3 border-b border-gray-200 px-4 py-3 dark:border-gray-700"
    (click)="onEditTask()"
  >
    <div class="task-icon-badge flex h-9 w-9 shrink-0 items-center justify-center rounded-lg">
      <ng-icon
        class="text-sm text-white"
        [name]="this.taskService.getDifficultyIcon(task().difficulty)"
      />
    </div>
    <h3
      class="min-w-0 flex-1 truncate font-semibold text-gray-900 dark:text-white"
      [class.line-through]="!task().started"
    >
      {{ task().name }}
    </h3>
    <button
      hlmBtn
      variant="outline"
      size="icon"
      [hlmDropdownMenuTrigger]="taskMenu"
      (click)="$event.stopPropagation()"
    >
      <ng-icon name="lucideEllipsis" />
    </button>
    <ng-template #taskMenu>
      <hlm-dropdown-menu>
        <button hlmDropdownMenuItem class="text-sm" (triggered)="onEditTask()">
          <ng-icon name="lucidePencil" />
          Edit
        </button>
        <button
          hlmDropdownMenuItem
          variant="destructive"
          class="text-sm"
          (triggered)="onDeleteTask()"
        >
          <ng-icon name="lucideTrash2" />
          Delete
        </button>
      </hlm-dropdown-menu>
    </ng-template>
  </div>
  <hlm-alert-dialog
    [state]="confirmingDelete() ? 'open' : 'closed'"
    (stateChanged)="onConfirmDialogStateChanged($event)"
  >
    <hlm-alert-dialog-content *hlmAlertDialogPortal="let ctx">
      <hlm-alert-dialog-header>
        <h2 hlmAlertDialogTitle>Delete task{{ task().name }}</h2>
        <p hlmAlertDialogDescription>Do you want to delete this record?</p>
      </hlm-alert-dialog-header>
      <hlm-alert-dialog-footer>
        <button hlmAlertDialogCancel>Cancel</button>
        <button hlmAlertDialogAction variant="destructive" (click)="onConfirmDeleteTask()">
          Delete
        </button>
      </hlm-alert-dialog-footer>
    </hlm-alert-dialog-content>
  </hlm-alert-dialog>

  <div class="flex flex-1 cursor-pointer flex-col px-4 py-3" (click)="onEditTask()">
    <p
      class="grow text-sm leading-relaxed text-gray-600 dark:text-gray-300"
      [class.line-through]="!task().started"
    >
      {{ task().description }}
    </p>
    @if (task().tags.length) {
      <div class="mt-3 flex flex-wrap gap-1.5">
        @for (tag of task().tags; track tag) {
          <span
            class="rounded-full bg-white px-2.5 py-0.5 text-xs text-gray-600 ring-1 ring-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:ring-gray-600"
          >
            {{ tag }}
          </span>
        }
      </div>
    }
  </div>

  <div
    class="mt-auto flex flex-wrap items-center gap-2 border-t border-gray-200 bg-gray-50 px-4 py-2.5 dark:border-gray-700 dark:bg-gray-900/40"
  >
    <span
      class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold"
      [class]="getDifficultyBadgeClass(task().difficulty)"
    >
      <ng-icon [name]="this.taskService.getPeriodicityIcon(task().periodicity)" />
      {{ task().periodicity | titlecase }}
    </span>
    @if (task().duration) {
      <span
        class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-semibold text-gray-500 dark:bg-gray-700 dark:text-gray-400"
      >
        <ng-icon name="lucideHourglass" />
        {{ task().duration }} min
      </span>
    }
  </div>
</div>
